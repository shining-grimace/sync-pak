name: sync-pak
title: SyncPak
version: '0.1.0'
summary: Synchronise local folders with cloud storage
description: |
  SyncPak is a cross-platform application for copying local folders directly
  to cloud providers, with add-only, mirror, and archive operations.
icon: packaging/linux/com.shininggrimace.SyncPak.svg
base: core24
confinement: strict
grade: devel

platforms:
  amd64:

apps:
  sync-pak:
    command: bin/sync-pak
    extensions: [gnome]
    desktop: usr/share/applications/com.shininggrimace.SyncPak.desktop
    environment:
      GTK_USE_PORTAL: '1'
    plugs:
      - desktop
      - network
      - opengl
      - password-manager-service
      - wayland
      - x11

parts:
  sync-pak:
    plugin: rust
    source: .
    rust-cargo-parameters:
      - --locked
      - --release
    override-build: |
      craftctl default
      install -Dm644 packaging/linux/com.shininggrimace.SyncPak.desktop "$CRAFT_PART_INSTALL/usr/share/applications/com.shininggrimace.SyncPak.desktop"
      install -Dm644 packaging/linux/com.shininggrimace.SyncPak.svg "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/com.shininggrimace.SyncPak.svg"
    build-packages:
      - libegl1-mesa-dev
      - libfontconfig1-dev
      - libgl1-mesa-dev
      - libwayland-dev
      - libxkbcommon-dev
      - pkg-config
    stage-packages:
      - libegl1
      - libfontconfig1
      - libgl1
      - libwayland-client0
      - libxkbcommon0

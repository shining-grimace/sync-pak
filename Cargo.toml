[package]
name = "sync-pak"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["provider-s3"]
feasibility-probes = []
provider-probes = ["provider-s3", "dep:tokio"]
provider-s3 = [
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio",
    "dep:tower-service",
]

[dependencies]
aws-config = { version = "=1.9.0", default-features = false, features = ["rt-tokio", "rustls"], optional = true }
aws-sdk-s3 = { version = "=1.138.1", default-features = false, features = ["rt-tokio", "rustls"], optional = true }
keyring-core = "=1.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
slint = { version = "=1.17.1", default-features = false, features = ["accessibility", "compat-1-2", "std"] }
tokio = { version = "=1.52.4", features = ["macros", "rt-multi-thread", "time"], optional = true }
uuid = { version = "=1.21.0", features = ["v4"] }
unicode-normalization = "=0.1.24"
zip = { version = "=2.4.2", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
notify-rust = "=4.18.0"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
zbus-secret-service-keyring-store = { version = "=1.0.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit", "renderer-femtovg"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
aws-smithy-runtime-api = { version = "=1.13.0", features = ["client", "http-1x"], optional = true }
aws-smithy-types = { version = "=1.6.1", features = ["http-body-1-x"], optional = true }
hyper = { version = "=1.10.1", default-features = false, features = ["client", "http1", "http2"], optional = true }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "http2", "tls12"], optional = true }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"], optional = true }
jni = "=0.22.4"
rustls = { version = "=0.23.42", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "=0.7.0", optional = true }
slint = { version = "=1.17.1", default-features = false, features = ["backend-android-activity-06", "renderer-femtovg"] }
tower-service = { version = "=0.3.3", optional = true }

[build-dependencies]
slint-build = "=1.17.1"

[[example]]
name = "desktop_notification"
required-features = ["feasibility-probes"]

[[example]]
name = "provider_operations"
required-features = ["provider-probes"]
